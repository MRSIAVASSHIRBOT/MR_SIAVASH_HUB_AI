name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check browser JavaScript syntax
        run: node --check backend/mrhub/web/app.js
      - name: Check Cloudflare Worker gateway syntax
        run: node --check cloudflare/gateway/src/index.js
      - name: Test Cloudflare Worker gateway contracts
        run: node --test cloudflare/gateway/test/*.test.mjs
      - name: Run test suite with coverage
        run: python -m pytest --cov=mrhub --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Build wheel and verify packaged UI assets
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          with ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          required = {
              "mrhub/web/index.html",
              "mrhub/web/app.css",
              "mrhub/web/app.js",
          }
          missing = required - packaged
          assert not missing, f"wheel is missing packaged UI assets: {sorted(missing)}"
          print(f"Verified wheel: {wheels[0].name}; UI assets: {len(required)}")
          PY
          python -m venv /tmp/mrhub-wheel-smoke
          /tmp/mrhub-wheel-smoke/bin/python -m pip install dist/*.whl
          MRH_ENVIRONMENT=test MRH_DATABASE_PATH=/tmp/mrhub-wheel-smoke.sqlite3 \
            /tmp/mrhub-wheel-smoke/bin/python - <<'PY'
          import asyncio
          import httpx
          from mrhub.main import create_app

          async def main() -> None:
              transport = httpx.ASGITransport(app=create_app())
              async with httpx.AsyncClient(
                  transport=transport, base_url="http://testserver"
              ) as client:
                  response = await client.get("/health")
                  assert response.status_code == 200, response.text

          asyncio.run(main())
          PY
      - name: Lint backend and tests
        run: python -m ruff check backend/mrhub tests backend/tests

  wheel-smoke:
    name: Wheel smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build wheel, verify package assets, and smoke-test clean install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          wheel_path = wheels[0].resolve()
          with ZipFile(wheel_path) as wheel:
              packaged = set(wheel.namelist())
          required = {
              "mrhub/web/index.html",
              "mrhub/web/app.css",
              "mrhub/web/app.js",
          }
          missing = required - packaged
          assert not missing, f"wheel is missing packaged UI assets: {sorted(missing)}"

          smoke_root = Path(tempfile.mkdtemp(prefix="mrhub-wheel-smoke-"))
          environment = smoke_root / "venv"
          subprocess.run(
              [sys.executable, "-m", "venv", str(environment)],
              check=True,
          )
          installed_python = environment / (
              "Scripts/python.exe" if os.name == "nt" else "bin/python"
          )
          subprocess.run(
              [str(installed_python), "-m", "pip", "install", str(wheel_path)],
              check=True,
              cwd=smoke_root,
          )
          smoke_environment = os.environ.copy()
          smoke_environment["MRH_ENVIRONMENT"] = "test"
          smoke_environment["MRH_DATABASE_PATH"] = str(smoke_root / "smoke.sqlite3")
          smoke_code = """
          import asyncio
          import httpx
          from mrhub.main import create_app

          async def main():
              transport = httpx.ASGITransport(app=create_app())
              async with httpx.AsyncClient(
                  transport=transport, base_url="http://testserver"
              ) as client:
                  response = await client.get("/health")
                  assert response.status_code == 200, response.text

          asyncio.run(main())
          """
          subprocess.run(
              [str(installed_python), "-c", smoke_code],
              check=True,
              cwd=smoke_root,
              env=smoke_environment,
          )
          print(
              f"Wheel install and /health smoke passed: {wheel_path.name}; "
              f"OS={sys.platform}; Python={sys.version.split()[0]}"
          )
          PY
