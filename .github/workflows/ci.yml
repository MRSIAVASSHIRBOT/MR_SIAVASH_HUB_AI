name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest
      - name: Lint workflow, worker, recovery, and submission changes
        run: >-
          python -m ruff check
          backend/mrhub/agents/submission_repository.py
          backend/mrhub/agents/workflow_runner.py
          backend/mrhub/agents/worker_dispatch.py
          backend/mrhub/api/routes/agent.py
          backend/mrhub/infrastructure/migrations.py
          backend/mrhub/jobs/worker.py
          backend/mrhub/jobs/engine.py
          backend/mrhub/jobs/recovery.py
          backend/mrhub/jobs/leases.py
          tests/test_migrations.py
          tests/test_workflow_submission_repository.py
          tests/test_workflow_submission_api.py
          tests/client_helpers.py
          tests/test_workflow_recovery.py
          tests/test_worker.py
          backend/mrhub/agents/execution_inputs.py
          tests/test_workflow_execution_inputs.py
          backend/mrhub/capabilities/registry.py
          backend/mrhub/capabilities/github_discovery.py
          backend/mrhub/capabilities/metadata_evaluation.py
          backend/mrhub/api/routes/capabilities.py
          tests/test_capability_registry.py
          tests/test_github_discovery.py
          tests/test_metadata_evaluation.py
          tests/test_capability_api.py
