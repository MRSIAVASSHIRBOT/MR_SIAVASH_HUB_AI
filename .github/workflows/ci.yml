name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Check browser JavaScript syntax
        run: node --check backend/mrhub/web/app.js
      - name: Check Cloudflare Worker gateway syntax
        run: node --check cloudflare/gateway/src/index.js
      - name: Test Cloudflare Worker gateway contracts
        run: node --test cloudflare/gateway/test/*.test.mjs
      - name: Run test suite with coverage
        run: python -m pytest --cov=mrhub --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml
      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 # v4.6.2
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7
      - name: Build wheel and verify packaged UI assets
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          with ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          required = {
              "mrhub/web/index.html",
              "mrhub/web/app.css",
              "mrhub/web/app.js",
          }
          missing = required - packaged
          assert not missing, f"wheel is missing packaged UI assets: {sorted(missing)}"
          print(f"Verified wheel: {wheels[0].name}; UI assets: {len(required)}")
          PY
          python -m venv /tmp/mrhub-wheel-smoke
          /tmp/mrhub-wheel-smoke/bin/python -m pip install dist/*.whl
          MRH_ENVIRONMENT=test MRH_DATABASE_PATH=/tmp/mrhub-wheel-smoke.sqlite3 \
            /tmp/mrhub-wheel-smoke/bin/python -c "from fastapi.testclient import TestClient; from mrhub.main import create_app; response = TestClient(create_app()).get('/health'); assert response.status_code == 200"
      - name: Lint backend and tests
        run: python -m ruff check backend/mrhub tests backend/tests


  wheel-smoke-windows:
    name: Windows wheel smoke (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build wheel and verify packaged UI assets
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist
          @'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          with ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          required = {
              "mrhub/web/index.html",
              "mrhub/web/app.css",
              "mrhub/web/app.js",
          }
          missing = required - packaged
          assert not missing, f"wheel is missing packaged UI assets: {sorted(missing)}"
          print(f"Verified wheel: {wheels[0].name}; UI assets: {len(required)}")
          '@ | python -
      - name: Install wheel into a clean environment
        shell: pwsh
        run: |
          python -m venv .wheel-smoke
          $wheel = (Get-ChildItem dist/*.whl).FullName
          & .\.wheel-smoke\Scripts\python.exe -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { throw "Clean wheel installation failed." }
      - name: Exercise packaged API and UI
        shell: pwsh
        run: |
          $env:MRH_ENVIRONMENT = "test"
          $env:MRH_DATABASE_PATH = Join-Path $env:RUNNER_TEMP "mrhub-wheel-smoke.sqlite3"
          @'
          import asyncio
          import httpx
          from mrhub.main import create_app

          async def main() -> None:
              transport = httpx.ASGITransport(app=create_app())
              async with httpx.AsyncClient(
                  transport=transport, base_url="http://testserver"
              ) as client:
                  health = await client.get("/health")
                  assert health.status_code == 200, health.text
                  ui = await client.get("/ui/")
                  assert ui.status_code == 200, ui.status_code
                  assert ui.headers.get("content-type", "").startswith("text/html")

          asyncio.run(main())
          '@ | & .\.wheel-smoke\Scripts\python.exe -


  opencode-policy:
    name: Validate scheduled OpenCode security policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned OpenCode CLI
        run: npm install --global opencode-ai@1.19.4
      - name: Verify effective default-deny configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          workflow = Path(".github/workflows/continuous-development.yml").read_text(encoding="utf-8")
          policy_line = next(
              (
                  line.strip()
                  for line in workflow.splitlines()
                  if line.strip().startswith("OPENCODE_CONFIG_CONTENT: '")
              ),
              None,
          )
          if policy_line is None:
              raise SystemExit("Scheduled workflow is missing its inline OpenCode policy.")
          policy_json = policy_line.split("'", 2)[1]

          environment = os.environ.copy()
          environment["OPENCODE_CONFIG_CONTENT"] = policy_json
          result = subprocess.run(
              ["opencode", "--pure", "debug", "config"],
              check=True,
              capture_output=True,
              text=True,
              env=environment,
          )
          config = json.loads(result.stdout)
          policy = config.get("permission")
          if not isinstance(policy, dict) or policy.get("*") != "deny":
              raise SystemExit("Effective OpenCode policy is not default-deny.")
          read_policy = policy.get("read")
          if not isinstance(read_policy, dict) or read_policy.get("*") != "allow":
              raise SystemExit("Workspace file reading is not explicitly allowed.")
          for pattern in ("*.env", "*.env.*", "**/.env", "**/.env.*"):
              if read_policy.get(pattern) != "deny":
                  raise SystemExit("Secret-file read pattern is not denied: " + pattern)
          for tool in ("edit", "glob"):
              if policy.get(tool) != "allow":
                  raise SystemExit("Required workspace tool is not allowed: " + tool)
          for tool in ("bash", "task", "skill", "webfetch", "websearch", "lsp", "grep", "external_directory"):
              if policy.get(tool) != "deny":
                  raise SystemExit("Unsafe or external tool is not denied: " + tool)
          build_policy = config.get("agent", {}).get("build", {}).get("permission")
          if not isinstance(build_policy, dict) or build_policy.get("*") != "deny":
              raise SystemExit("Build agent is not configured with default-deny policy.")
          print("Verified effective default-deny OpenCode tool policy.")
          PY
