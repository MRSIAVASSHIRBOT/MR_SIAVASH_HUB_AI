name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run test suite
        run: python -m pytest
      - name: Build wheel and verify packaged UI assets
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected one wheel, found {len(wheels)}"
          with ZipFile(wheels[0]) as wheel:
              packaged = set(wheel.namelist())
          required = {
              "mrhub/web/index.html",
              "mrhub/web/app.css",
              "mrhub/web/app.js",
          }
          missing = required - packaged
          assert not missing, f"wheel is missing packaged UI assets: {sorted(missing)}"
          print(f"Verified wheel: {wheels[0].name}; UI assets: {len(required)}")
          PY
      - name: Lint backend and tests
        run: python -m ruff check backend/mrhub tests
