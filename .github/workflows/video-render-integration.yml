name: Video Render Integration

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: video-render-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-ffmpeg-render:
    name: Real FFmpeg MP4 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install verified FFmpeg and FFprobe
        timeout-minutes: 8
        run: |
          set -euo pipefail

          # Pin the official FFmpeg-Builds release asset by its published SHA-256 digest.
          # Any unexpected release change fails closed before the binaries are executed.
          release_tag="latest"
          archive_name="ffmpeg-master-latest-linux64-gpl.tar.xz"
          archive_sha256="f6f8a35568815b7a99e0c513d7c6593262422986047068db190980c4bc186865"
          archive_path="$RUNNER_TEMP/$archive_name"
          install_dir="$RUNNER_TEMP/ffmpeg-bin"

          mkdir -p "$install_dir"
          curl --fail --show-error --location \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --connect-timeout 20 --max-time 360 \
            "https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/$release_tag/$archive_name" \
            --output "$archive_path"

          printf '%s  %s\n' "$archive_sha256" "$archive_path" | sha256sum --check --strict
          tar -xJf "$archive_path" -C "$install_dir" \
            --strip-components=2 --no-anchored ffmpeg ffprobe
          chmod 0755 "$install_dir/ffmpeg" "$install_dir/ffprobe"

          test -x "$install_dir/ffmpeg"
          test -x "$install_dir/ffprobe"
          encoders="$("$install_dir/ffmpeg" -hide_banner -encoders 2>&1)"
          if ! grep -Eq '[[:space:]]libx264[[:space:]]' <<<"$encoders"; then
            echo "::error::Pinned FFmpeg build does not expose the required libx264 encoder."
            exit 1
          fi

          echo "$install_dir" >> "$GITHUB_PATH"
          export PATH="$install_dir:$PATH"
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Require a real MP4 render and FFprobe verification
        env:
          MRH_REQUIRE_FFMPEG: "1"
        run: |
          python -m pytest -q backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_produces_probeable_mp4_when_available

  real-ffmpeg-render-windows:
    name: Real FFmpeg MP4 integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw "FFmpeg was not added to PATH"
          }
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw "FFprobe was not added to PATH"
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Require a real MP4 render and FFprobe verification
        env:
          MRH_REQUIRE_FFMPEG: "1"
        run: |
          python -m pytest -q backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_produces_probeable_mp4_when_available
