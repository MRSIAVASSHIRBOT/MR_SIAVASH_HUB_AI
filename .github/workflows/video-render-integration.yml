name: Video Render Integration

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: video-render-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-ffmpeg-render:
    name: Real FFmpeg MP4 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Require a real MP4 render and FFprobe verification
        env:
          MRH_REQUIRE_FFMPEG: "1"
        run: |
          python -m pytest -q backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_produces_probeable_mp4_when_available
