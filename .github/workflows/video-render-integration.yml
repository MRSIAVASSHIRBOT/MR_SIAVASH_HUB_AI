name: Video Render Integration

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: video-render-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-ffmpeg-render:
    name: Real FFmpeg MP4 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and FFprobe when not already available
        timeout-minutes: 18
        run: |
          set -euo pipefail

          has_required_ffmpeg() {
            command -v ffmpeg >/dev/null 2>&1               && command -v ffprobe >/dev/null 2>&1               && ffmpeg -hide_banner -encoders 2>&1 | grep -Eq '[[:space:]]libx264[[:space:]]'
          }

          if has_required_ffmpeg; then
            echo "Using the runner-provided FFmpeg and FFprobe binaries."
          else
            # GitHub-hosted Ubuntu images can point at a regional EC2 HTTP mirror
            # that is unreachable from the runner. Normalize that mirror to the
            # official HTTPS Ubuntu archive while preserving signed apt metadata.
            sudo python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("/etc/apt/apt-mirrors.txt"),
              Path("/etc/apt/sources.list"),
              *Path("/etc/apt/sources.list.d").glob("*"),
          ]
          for source in candidates:
              if not source.is_file():
                  continue
              original = source.read_text()
              updated = re.sub(
                  r"http://[a-z0-9-]+\.ec2\.archive\.ubuntu\.com/ubuntu",
                  "https://archive.ubuntu.com/ubuntu",
                  original,
              )
              if updated != original:
                  source.write_text(updated)
                  print(f"Normalized Ubuntu archive mirror in {source}")
          PY
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::Languages=none -o Acquire::PDiffs=false update
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --no-install-recommends -y ffmpeg
          fi

          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'

          encoders="$(ffmpeg -hide_banner -encoders 2>&1)"
          if ! grep -Eq '[[:space:]]libx264[[:space:]]' <<<"$encoders"; then
            echo "::error::FFmpeg does not expose the required libx264 encoder."
            exit 1
          fi
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Require a real MP4 render and FFprobe verification
        env:
          MRH_REQUIRE_FFMPEG: "1"
        run: |
          python -m pytest -q \
            backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_produces_probeable_mp4_when_available \
            backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_preserves_source_audio_when_available

  real-ffmpeg-render-windows:
    name: Real FFmpeg MP4 integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned FFmpeg and FFprobe
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          # FFmpeg's Windows download page lists gyan.dev builds. Pin the
          # versioned GitHub release and verify GitHub's published SHA-256
          # digest before extracting or executing any downloaded binary.
          $archiveName = "ffmpeg-9.1-essentials_build.zip"
          $archiveUrl = "https://github.com/GyanD/codexffmpeg/releases/download/9.1/$archiveName"
          $expectedSha256 = "b9bbbb3acece000cbeec994f856649354e52c773807841e78908374b24d658fd"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg-9.1-essentials"

          Invoke-WebRequest -Uri $archiveUrl -OutFile $archivePath -TimeoutSec 300
          $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg archive SHA-256 mismatch: expected $expectedSha256, received $actualSha256"
          }

          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $ffmpeg = Get-ChildItem -Path $extractPath -Filter "ffmpeg.exe" -Recurse -File | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extractPath -Filter "ffprobe.exe" -Recurse -File | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) {
            throw "The verified FFmpeg archive did not contain both ffmpeg.exe and ffprobe.exe"
          }

          $binPath = $ffmpeg.Directory.FullName
          if ($ffprobe.Directory.FullName -ne $binPath) {
            throw "FFmpeg and FFprobe were extracted into different directories"
          }

          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          $env:PATH = "$binPath;$env:PATH"

          $ffmpegVersionOutput = @(& $ffmpeg.FullName -version 2>&1)
          $ffmpegExitCode = $LASTEXITCODE
          $ffmpegVersion = [string]($ffmpegVersionOutput | Select-Object -First 1)
          Write-Output "FFmpeg version probe (exit $ffmpegExitCode): $ffmpegVersion"
          if ($ffmpegExitCode -ne 0 -or $ffmpegVersion -notmatch "^ffmpeg version 9\.1") {
            throw "Pinned FFmpeg 9.1 executable failed its version check"
          }

          $ffprobeVersionOutput = @(& $ffprobe.FullName -version 2>&1)
          $ffprobeExitCode = $LASTEXITCODE
          $ffprobeVersion = [string]($ffprobeVersionOutput | Select-Object -First 1)
          Write-Output "FFprobe version probe (exit $ffprobeExitCode): $ffprobeVersion"
          if ($ffprobeExitCode -ne 0 -or $ffprobeVersion -notmatch "^ffprobe version 9\.1") {
            throw "Pinned FFprobe 9.1 executable failed its version check"
          }

          $encoders = (& $ffmpeg.FullName -hide_banner -encoders 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $encoders -notmatch "(?m)^\s*V[^\r\n]*\blibx264\b") {
            throw "Pinned FFmpeg build does not expose the required libx264 video encoder"
          }

          Write-Output $ffmpegVersion
          Write-Output $ffprobeVersion
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Require a real MP4 render and FFprobe verification
        env:
          MRH_REQUIRE_FFMPEG: "1"
        run: python -m pytest -q backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_produces_probeable_mp4_when_available backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_preserves_source_audio_when_available
