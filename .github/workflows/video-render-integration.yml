name: Video Render Integration

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "feat/**"]

permissions:
  contents: read

concurrency:
  group: video-render-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-ffmpeg-render:
    name: Real FFmpeg MP4 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and FFprobe
        timeout-minutes: 12
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            APT_OPTIONS=(
              -o Acquire::Retries=1
              -o Acquire::http::Timeout=20
              -o Acquire::https::Timeout=20
              -o Acquire::http::ConnectionTimeout=10
              -o Acquire::https::ConnectionTimeout=10
            )

            # Prefer the runner's cached package indexes; update them only when
            # the package cannot be installed from the existing metadata.
            if ! timeout --signal=TERM --kill-after=10s 180s \
              sudo apt-get "${APT_OPTIONS[@]}" install --no-install-recommends -y ffmpeg; then
              echo "::warning::FFmpeg install from cached apt metadata failed; refreshing package indexes once."
              timeout --signal=TERM --kill-after=10s 300s \
                sudo apt-get "${APT_OPTIONS[@]}" update
              timeout --signal=TERM --kill-after=10s 180s \
                sudo apt-get "${APT_OPTIONS[@]}" install --no-install-recommends -y ffmpeg
            fi
          else
            echo "Using runner-provided FFmpeg and FFprobe."
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Require a real MP4 render and FFprobe verification
        env:
          MRH_REQUIRE_FFMPEG: "1"
        run: |
          python -m pytest -q backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_produces_probeable_mp4_when_available

  real-ffmpeg-render-windows:
    name: Real FFmpeg MP4 integration (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and FFprobe
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw "FFmpeg was not added to PATH"
          }
          if (-not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw "FFprobe was not added to PATH"
          }
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Require a real MP4 render and FFprobe verification
        env:
          MRH_REQUIRE_FFMPEG: "1"
        run: |
          python -m pytest -q backend/tests/test_video_render_engine.py::test_real_ffmpeg_render_produces_probeable_mp4_when_available
