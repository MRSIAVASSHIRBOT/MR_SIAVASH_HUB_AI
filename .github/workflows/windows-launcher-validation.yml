name: Windows Launcher Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/*.ps1"
      - ".github/workflows/windows-launcher-validation.yml"

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $files = @("scripts/start-local.ps1", "scripts/stop-local.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }
