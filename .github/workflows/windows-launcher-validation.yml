name: Windows Launcher Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "scripts/**"
      - "backend/**"
      - "pyproject.toml"
      - ".env.example"
      - ".github/workflows/windows-launcher-validation.yml"

permissions:
  contents: read

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $files = @("scripts/start-local.ps1", "scripts/stop-local.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }
  runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
      - name: Install project into a clean Python 3.11 environment
        shell: pwsh
        run: |
          py -3.11 -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Virtual environment creation failed." }
          & .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -e .
          if ($LASTEXITCODE -ne 0) { throw "Project installation failed." }
      - name: Start, verify, and stop API plus worker
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:MRH_DATABASE_PATH = Join-Path $env:RUNNER_TEMP "mrhub-launcher-smoke.sqlite3"
          $env:MRH_REQUIRE_WORKER_FOR_READINESS = "true"
          try {
            & .\scripts\start-local.ps1 -SkipInstall
            if ($LASTEXITCODE -ne 0) { throw "Local launcher failed." }
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:8000/health" -TimeoutSec 5
            $ready = Invoke-RestMethod -Uri "http://127.0.0.1:8000/ready" -TimeoutSec 5
            if ($ready.status -ne "ready" -or $ready.worker -ne "running") {
              throw "API and worker did not reach ready state."
            }
            $ui = Invoke-WebRequest -Uri "http://127.0.0.1:8000/ui/" -UseBasicParsing -TimeoutSec 5
            if ($ui.StatusCode -ne 200) { throw "Operator UI did not return HTTP 200." }
            Write-Host "Health, readiness, and operator UI smoke checks passed."
          }
          finally {
            if (Test-Path ".mrhub-runtime.json") {
              & .\scripts\stop-local.ps1
            }
          }

  failed-startup-cleanup:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4
        with:
          persist-credentials: false
      - name: Install project into a clean Python 3.11 environment
        shell: pwsh
        run: |
          py -3.11 -m venv .venv
          if ($LASTEXITCODE -ne 0) { throw "Virtual environment creation failed." }
          & .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -e .
          if ($LASTEXITCODE -ne 0) { throw "Project installation failed." }
      - name: Verify worker cleanup when API port is unavailable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:MRH_DATABASE_PATH = Join-Path $env:RUNNER_TEMP "mrhub-launcher-failure.sqlite3"
          $env:MRH_REQUIRE_WORKER_FOR_READINESS = "true"
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 8000)
          $listener.Start()
          try {
            & pwsh -NoProfile -File .\scripts\start-local.ps1 -SkipInstall
            $launcherExit = $LASTEXITCODE
            if ($launcherExit -eq 0) {
              throw "Launcher unexpectedly reported success while port 8000 was occupied."
            }
            if (Test-Path ".mrhub-runtime.json") {
              throw "Runtime record was not removed after both launcher-owned processes exited."
            }
            Start-Sleep -Seconds 2
            $orphan = Get-CimInstance Win32_Process | Where-Object {
              $_.CommandLine -and $_.CommandLine.Contains("mrhub.worker_service")
            } | Select-Object -First 1
            if ($orphan) {
              throw "Worker process $($orphan.ProcessId) remained after failed startup."
            }
            Write-Host "Failed-startup cleanup smoke test passed."
            $global:LASTEXITCODE = 0
          }
          finally {
            $listener.Stop()
          }
