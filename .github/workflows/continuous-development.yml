name: Continuous Development

on:
  # Scheduled runs execute from the default branch only. Do not expose the
  # privileged publisher job through workflow_dispatch on arbitrary branches.
  schedule:
    - cron: "23 */2 * * *"

# Default and model-agent token permissions are read-only.
permissions:
  contents: read

concurrency:
  group: continuous-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@1.19.4

      - name: Run one focused development cycle
        shell: bash
        env:
          MODEL: openrouter/cohere/north-mini-code:free
          OPENROUTER_API_KEY: ${{ secrets.MR_SIAVASH_HUB_AI }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Repository secret MR_SIAVASH_HUB_AI is missing or empty."
            exit 1
          fi
          set +e
          opencode run --model "$MODEL" --title "Scheduled MR HUB development" "$(cat <<'PROMPT'
          You are the scheduled engineering agent for MR_SIAVASH_HUB_AI.

          Read AGENTS.md and project documentation first. Inspect the repository,
          recent commits, open issues and pull requests, architecture, existing tests,
          and CI. Select exactly one highest-value, small, verifiable improvement
          that is not already implemented or in progress. Prefer fixing a verified
          defect or completing a documented incomplete capability. Otherwise add
          one small capability consistent with existing architecture.

          Work only in the current automation workspace. Do not change workflow
          permissions, secrets, deployment settings, or security controls. Never
          expose credentials, weaken security, perform destructive operations, or
          make unrelated refactors. Add/update tests. Run relevant tests and lint
          commands discovered from the project documentation. Do not claim checks
          passed unless they actually pass. If no safe useful change is justified,
          leave the tree unchanged and explain why. Summarize exact files changed,
          tests and results, risks, and next priority.
          PROMPT
          )" > "$RUNNER_TEMP/opencode.log" 2>&1
          agent_status=$?
          set -e
          cat "$RUNNER_TEMP/opencode.log"
          if [ "$agent_status" -ne 0 ]; then
            if grep -Fq "Rate limit exceeded: free-models-per-day" "$RUNNER_TEMP/opencode.log"; then
              echo "::warning::The free OpenRouter model quota is exhausted; this scheduled cycle is a no-op and no patch will be published."
            else
              exit "$agent_status"
            fi
          fi

      - name: Detect and package changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Include untracked files in a patch; never pass an agent-controlled
          # archive to the privileged publisher job.
          git add -N -A
          git diff --binary HEAD > "$RUNNER_TEMP/agent.patch"

      - name: Upload proposed patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-proposal
          path: ${{ runner.temp }}/agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: develop
    if: needs.develop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted main base without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download proposed patch
        id: proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-proposal
          path: ${{ runner.temp }}/agent-proposal

      - name: Validate proposal
        if: steps.proposal.outcome == 'success'
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/agent-proposal/agent.patch"
          [ -f "$PATCH" ] || { echo "::error::Missing agent patch"; exit 1; }
          SIZE=$(wc -c < "$PATCH")
          [ "$SIZE" -le 1048576 ] || { echo "::error::Patch exceeds 1 MiB"; exit 1; }
          git apply --check --index --binary "$PATCH"
          git apply --index --binary "$PATCH"

          # Inspect normalized staged paths, not patch header text. This catches
          # rename targets and unusual path spellings before the privileged push.
          python - <<'PY'
          import subprocess
          import sys

          raw_paths = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "-z"]
          )
          paths = [path for path in raw_paths.split(bytes([0])) if path]
          if not paths:
              print("No staged paths in the proposed patch.")
              sys.exit(1)

          protected_exact = {
              b"AGENTS.md",
              b"CODEOWNERS",
              b"pyproject.toml",
              b".gitmodules",
              b"SECURITY.md",
              b"uv.lock",
              b"poetry.lock",
              b"Pipfile.lock",
              b".env",
              b".env.example",
              b"wrangler.toml",
              b"cloudflare/wrangler.toml",
          }
          protected_prefixes = (
              b".github/",
              b"SECURITY/",
              b".git/",
              b"scripts/deploy/",
              b".devcontainer/",
          )
          blocked = [
              path for path in paths
              if path in protected_exact
              or path in {b".github", b"SECURITY", b".git"}
              or path.startswith(b".env")
              or path.endswith(b"/wrangler.toml")
              or any(path.startswith(prefix) for prefix in protected_prefixes)
          ]
          if blocked:
              for path in blocked:
                  print(f"::error::Agent proposal touches protected path: {path!r}")
              sys.exit(1)

          staged_paths = set(paths)
          staged = subprocess.check_output(["git", "ls-files", "--stage", "-z"])
          for entry in staged.split(bytes([0])):
              if not entry:
                  continue
              metadata, path = entry.split(bytes([9]), 1)
              if path not in staged_paths:
                  continue
              mode = metadata.split(b" ", 1)[0]
              if mode in {b"120000", b"160000"}:
                  print(f"::error::Unsupported symlink/submodule entry: {path!r}")
                  sys.exit(1)
          print(f"Validated {len(paths)} staged path(s).")
          PY
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Apply proposal and create review PR
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/continuous-development-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          # The validation step already applied and staged the checked patch.
          if git diff --cached --quiet; then
            echo "No applicable changes; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: scheduled incremental development"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --set-upstream origin "$BRANCH"
          gh pr create \
            --title "Scheduled development: run ${GITHUB_RUN_ID}" \
            --body "Automated, focused development proposal. Review the diff and CI results before merging. This PR was not merged automatically." \
            --base "main" \
            --head "$BRANCH"
