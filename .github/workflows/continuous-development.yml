name: Continuous Development

on:
  workflow_dispatch:
  schedule:
    # Run every two hours; minute 23 avoids the busiest top-of-hour window.
    - cron: "23 */2 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: continuous-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Run scheduled development cycle
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENROUTER_API_KEY: ${{ secrets.MR_SIAVASH_HUB_AI }}
        with:
          model: openrouter/cohere/north-mini-code:free
          prompt: |
            You are the scheduled engineering agent for MR_SIAVASH_HUB_AI.
            This run is an autonomous maintenance and incremental-development cycle, not a response to a user comment.

            1. Read AGENTS.md and the project documentation before editing.
            2. Inspect recent commits, open issues and pull requests, existing CI, tests, and the current architecture.
            3. Select exactly one highest-value, well-scoped improvement that is not already implemented or in progress. Prefer fixing a verified defect or completing a clearly documented incomplete capability; otherwise add one small, useful capability consistent with the architecture.
            4. Make focused changes only on a dedicated branch named automation/continuous-development-<run-id>. Never commit to or push to the default branch.
            5. Add or update tests for behavior changed. Run the most relevant tests, lint, and security checks available. Do not claim checks passed unless they actually ran and passed.
            6. Open or update a pull request for review with a concise explanation, evidence, test results, risks, and remaining work. Do not merge the pull request.
            7. If no safe, useful change can be justified, do not manufacture work; report the evidence and the next concrete priority.
            8. Never expose secrets, weaken security controls, perform destructive operations, or make unrelated broad refactors.
            Report only verified actions and exact blockers.
