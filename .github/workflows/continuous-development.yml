name: Continuous Development

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: continuous-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up development branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "automation/continuous-development-${GITHUB_RUN_ID}"

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@1.19.4

      - name: Run one focused development cycle
        shell: bash
        env:
          MODEL: openrouter/cohere/north-mini-code:free
          OPENROUTER_API_KEY: ${{ secrets.MR_SIAVASH_HUB_AI }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Repository secret MR_SIAVASH_HUB_AI is missing or empty."
            exit 1
          fi
          opencode run --model "$MODEL" --title "Scheduled MR HUB development" "$(cat <<'PROMPT'
          You are the scheduled engineering agent for MR_SIAVASH_HUB_AI.

          Read AGENTS.md and project documentation first. Inspect the repository,
          recent commits, open issues and pull requests, architecture, existing tests,
          and CI. Select exactly one highest-value, small, verifiable improvement
          that is not already implemented or in progress. Prefer fixing a verified
          defect or completing a documented incomplete capability. Otherwise add
          one small capability consistent with existing architecture.

          Work only in the current automation branch. Do not change workflow
          permissions, secrets, deployment settings, or security controls. Never
          expose credentials, weaken security, perform destructive operations, or
          make unrelated refactors. Add/update tests. Run relevant tests and lint
          commands discovered from the project documentation. Do not claim checks
          passed unless they actually pass. If no safe useful change is justified,
          leave the tree unchanged and explain why. Summarize exact files changed,
          tests and results, risks, and next priority.
          PROMPT
          )"

      - name: Validate changed files
        id: changes
        shell: bash
        run: |
          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push reviewed changes
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          git commit -m "chore: scheduled incremental development"
          git push --set-upstream origin "automation/continuous-development-${GITHUB_RUN_ID}"
          gh pr create \
            --title "Scheduled development: run ${GITHUB_RUN_ID}" \
            --body "Automated, focused development change. Review the diff and CI results before merging. This PR was not merged automatically." \
            --base "${GITHUB_REF_NAME}" \
            --head "automation/continuous-development-${GITHUB_RUN_ID}"
