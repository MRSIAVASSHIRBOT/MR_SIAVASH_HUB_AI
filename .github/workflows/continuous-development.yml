name: Continuous Development

on:
  # Scheduled runs execute from the default branch only. Do not expose the
  # privileged publisher job through workflow_dispatch on arbitrary branches.
  schedule:
    - cron: "23 */2 * * *"

# Default and model-agent token permissions are read-only.
permissions:
  contents: read

concurrency:
  group: continuous-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCODE_CONFIG_CONTENT: '{"permission":{"*":"deny","read":{"*":"allow","*.env":"deny","*.env.*":"deny","*.env.example":"allow","**/.env":"deny","**/.env.*":"deny","**/.env.example":"allow"},"edit":"allow","glob":"allow","grep":"allow","external_directory":"deny","bash":"deny","task":"deny","skill":"deny","webfetch":"deny","websearch":"deny","lsp":"deny"},"agent":{"build":{"permission":{"*":"deny","read":{"*":"allow","*.env":"deny","*.env.*":"deny","*.env.example":"allow","**/.env":"deny","**/.env.*":"deny","**/.env.example":"allow"},"edit":"allow","glob":"allow","grep":"allow","external_directory":"deny","bash":"deny","task":"deny","skill":"deny","webfetch":"deny","websearch":"deny","lsp":"deny"}}},"tools":{"bash":false},"lsp":false,"mcp":{}}'
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install OpenCode CLI
        run: npm install --global opencode-ai@1.19.4

      - name: Verify effective OpenCode tool policy
        shell: bash
        run: |
          set -euo pipefail
          opencode --pure debug config > "$RUNNER_TEMP/opencode-effective-config.json"
          python - "$RUNNER_TEMP/opencode-effective-config.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          config = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          policy = config.get("permission")
          if not isinstance(policy, dict) or policy.get("*") != "deny":
              raise SystemExit("OpenCode effective policy is not default-deny")
          read_policy = policy.get("read")
          if not isinstance(read_policy, dict) or read_policy.get("*") != "allow":
              raise SystemExit("Workspace file reading is not explicitly allowed")
          for pattern in ("*.env", "*.env.*", "**/.env", "**/.env.*"):
              if read_policy.get(pattern) != "deny":
                  raise SystemExit("Secret-file read pattern is not denied: " + pattern)
          for tool in ("edit", "glob", "grep"):
              if policy.get(tool) != "allow":
                  raise SystemExit("Required workspace tool is not allowed: " + tool)
          for tool in (
              "bash", "task", "skill", "webfetch", "websearch", "lsp",
              "external_directory",
          ):
              if policy.get(tool) != "deny":
                  raise SystemExit("Unsafe or external tool is not denied: " + tool)
          build_policy = config.get("agent", {}).get("build", {}).get("permission")
          if not isinstance(build_policy, dict) or build_policy.get("*") != "deny":
              raise SystemExit("Build agent is not configured with default-deny policy")
          print("Verified effective default-deny OpenCode tool policy.")
          PY

      - name: Run one focused development cycle
        shell: bash
        env:
          MODEL: openrouter/cohere/north-mini-code:free
          OPENROUTER_API_KEY: ${{ secrets.MR_SIAVASH_HUB_AI }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Repository secret MR_SIAVASH_HUB_AI is missing or empty."
            exit 1
          fi
          set +e
          opencode --pure run --model "$MODEL" --title "Scheduled MR HUB development" "$(cat <<'PROMPT'
          You are the scheduled engineering agent for MR_SIAVASH_HUB_AI.

          Read AGENTS.md and project documentation first. Inspect the repository,
          recent commits, open issues and pull requests, architecture, existing tests,
          and CI. Select exactly one highest-value, small, verifiable improvement
          that is not already implemented or in progress. Prefer fixing a verified
          defect or completing a documented incomplete capability. Otherwise add
          one small capability consistent with existing architecture.

          Work only in the current automation workspace. Do not change workflow
          permissions, secrets, deployment settings, or security controls. Never
          expose credentials, weaken security, perform destructive operations, or
          make unrelated refactors. Only workspace read/write/search tools are
          available; shell, network, skills, subagents, and external paths are denied.
          Add/update tests, but do not attempt to execute them. CI on the resulting
          review PR is the test gate. Do not claim checks passed unless they actually
          pass. If no safe useful change is justified, leave the tree unchanged and
          explain why. Summarize exact files changed, tests added (not run here),
          risks, and next priority.
          PROMPT
          )" > "$RUNNER_TEMP/opencode.log" 2>&1
          agent_status=$?
          set -e
          cat "$RUNNER_TEMP/opencode.log"
          if [ "$agent_status" -ne 0 ]; then
            if grep -Fq "Rate limit exceeded: free-models-per-day" "$RUNNER_TEMP/opencode.log"; then
              echo "::warning::The free OpenRouter model quota is exhausted; this scheduled cycle is a no-op and no patch will be published."
            else
              exit "$agent_status"
            fi
          fi

      - name: Detect and package changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Include untracked files in a patch; never pass an agent-controlled
          # archive to the privileged publisher job.
          git add -N -A
          git diff --binary HEAD > "$RUNNER_TEMP/agent.patch"

      - name: Upload proposed patch
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-proposal
          path: ${{ runner.temp }}/agent.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: develop
    if: needs.develop.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted main base without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Download proposed patch
        id: proposal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: agent-proposal
          path: ${{ runner.temp }}/agent-proposal

      - name: Validate proposal
        if: steps.proposal.outcome == 'success'
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/agent-proposal/agent.patch"
          [ -f "$PATCH" ] || { echo "::error::Missing agent patch"; exit 1; }
          SIZE=$(wc -c < "$PATCH")
          [ "$SIZE" -le 1048576 ] || { echo "::error::Patch exceeds 1 MiB"; exit 1; }
          git apply --check --index --binary "$PATCH"
          git apply --index --binary "$PATCH"

          # Inspect normalized staged paths, not patch headers. This catches
          # rename targets, nested secrets/configuration, and unusual path spellings.
          python - <<'PY'
          import subprocess
          import sys

          raw_paths = subprocess.check_output(
              ["git", "diff", "--cached", "--no-renames", "--name-only", "-z"]
          )
          paths = [path for path in raw_paths.split(bytes([0])) if path]
          if not paths:
              print("No staged paths in the proposed patch.")
              sys.exit(1)

          protected_exact = {
              b"agents.md", b"codeowners", b"opencode.json", b"opencode.jsonc",
              b"opencode.json5", b".gitignore", b"pyproject.toml", b"setup.py",
              b"setup.cfg", b"tox.ini", b"noxfile.py", b"makefile", b".gitmodules",
              b"security.md", b"uv.lock", b"poetry.lock", b"pipfile", b"pipfile.lock",
              b"pdm.lock", b"package.json", b"package-lock.json", b"pnpm-lock.yaml",
              b"yarn.lock", b"bun.lock", b"bun.lockb", b"cargo.toml", b"cargo.lock",
              b"go.mod", b"go.sum", b"composer.json", b"composer.lock", b"gemfile",
              b"gemfile.lock", b"wrangler.toml", b"wrangler.json", b"wrangler.jsonc",
              b"dockerfile", b"docker-compose.yml", b"docker-compose.yaml",
              b"compose.yml", b"compose.yaml", b"vercel.json", b"netlify.toml",
              b"fly.toml", b"backend/mrhub/api/dependencies.py",
              b"backend/mrhub/api/routes/agent_model_runs.py",
              b"backend/mrhub/api/routes/agent_run.py",
              b"backend/mrhub/api/routes/approvals.py",
              b"backend/mrhub/api/routes/auth.py", b"backend/mrhub/api/routes/jobs.py",
              b"backend/mrhub/api/routes/policy.py",
              b"backend/mrhub/api/routes/security_lab.py",
              b"backend/mrhub/api/routes/tasks.py", b"backend/mrhub/api/routes/tools.py",
              b"backend/mrhub/config.py", b"tests/test_audit.py", b"tests/test_auth.py",
              b"tests/test_tool_permissions.py",
          }
          protected_prefixes = (
              b".github/", b".opencode/", b"security/", b".git/",
              b"scripts/deploy/", b".devcontainer/", b"docs/security/",
              b"backend/mrhub/security/", b"backend/mrhub/tools/",
          )
          protected_basenames = {
              b"requirements.txt", b"requirements-dev.txt", b"requirements-test.txt",
              b"constraints.txt", b"constraints-dev.txt",
          }
          blocked = []
          for path in paths:
              normalized = path.lower()
              basename = normalized.rsplit(b"/", 1)[-1]
              components = normalized.split(b"/")
              dependency_or_build_file = (
                  basename in protected_basenames
                  or (basename.startswith(b"requirements") and basename.endswith(b".txt"))
                  or (basename.startswith(b"constraints") and basename.endswith(b".txt"))
                  or basename.endswith((b".lock", b".lockb"))
                  or basename.startswith((b"dockerfile", b"docker-compose.", b"compose."))
                  or basename in {
                      b"agents.md", b"codeowners", b"security.md", b"pyproject.toml",
                      b"setup.py", b"setup.cfg", b"tox.ini", b"noxfile.py",
                      b"package.json", b"cargo.toml", b"go.mod", b"composer.json",
                      b"gemfile", b"pipfile", b"makefile",
                  }
              )
              if (
                  normalized in protected_exact
                  or normalized in {b".github", b"security", b".git"}
                  or any(part.startswith(b".env") for part in components)
                  or basename.startswith(b"wrangler.")
                  or basename in {b"vercel.json", b"netlify.toml", b"fly.toml"}
                  or dependency_or_build_file
                  or any(normalized.startswith(prefix) for prefix in protected_prefixes)
              ):
                  blocked.append(path)
          if blocked:
              for path in blocked:
                  print("::error::Agent proposal touches protected path: %r" % path)
              sys.exit(1)

          staged_paths = set(paths)
          staged = subprocess.check_output(["git", "ls-files", "--stage", "-z"])
          for entry in staged.split(bytes([0])):
              if not entry:
                  continue
              metadata, path = entry.split(bytes([9]), 1)
              if path not in staged_paths:
                  continue
              mode = metadata.split(b" ", 1)[0]
              if mode in {b"120000", b"160000"}:
                  print("::error::Unsupported symlink/submodule entry: %r" % path)
                  sys.exit(1)
          print("Validated %d staged path(s)." % len(paths))
          PY
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Apply proposal and create review PR
        if: steps.validate.outputs.valid == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/continuous-development-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          # The validation step already applied and staged the checked patch.
          if git diff --cached --quiet; then
            echo "No applicable changes; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: scheduled incremental development"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push --set-upstream origin "$BRANCH"
          gh pr create \
            --title "Scheduled development: run ${GITHUB_RUN_ID}" \
            --body "Automated, focused development proposal. Review the diff and CI results before merging. This PR was not merged automatically." \
            --base "main" \
            --head "$BRANCH"
