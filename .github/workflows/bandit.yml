name: Defensive Python Scan

on:
  workflow_dispatch:
  push:
    branches: ["main", "architecture/**", "feature/**", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "37 3 * * 1"

permissions:
  contents: read

concurrency:
  group: bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Bandit defensive scan
        run: |
          bandit -r backend/mrhub \
            --severity-level medium \
            --confidence-level medium \
            --format screen
