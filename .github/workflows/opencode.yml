name: OpenCode Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: >-
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER') &&
      (contains(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENROUTER_API_KEY: ${{ secrets.MR_SIAVASH_HUB_AI }}
        with:
          model: openrouter/openrouter/free
          prompt: |
            Treat the triggering GitHub comment as the actual task request.
            Read repository guidance before changing code. Make focused, minimal changes that satisfy the request.
            Do not expose, print, or copy secrets. Do not weaken security controls, change unrelated files, or push directly to the default branch.
            Run the most relevant available tests and checks. If blocked, report the exact blocker and what was verified.
            Summarize changes, tests, and remaining risks in your final GitHub response.
