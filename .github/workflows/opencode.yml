name: OpenCode Agent

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: >-
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR' ||
       github.event.comment.author_association == 'MEMBER') &&
      (contains(github.event.comment.body, '/opencode') ||
       contains(github.event.comment.body, '/oc'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENROUTER_API_KEY: ${{ secrets.MR_SIAVASH_HUB_AI }}
        with:
          model: openrouter/cohere/north-mini-code:free
          prompt: |
            Treat the triggering GitHub comment as the sole task request; do not substitute an earlier comment, pull-request summary, or inferred task.
            First read AGENTS.md and the relevant project documentation. Make focused, minimal changes only when the triggering request asks for changes.
            Do not expose, print, or copy secrets. Do not weaken security controls, change unrelated files, or push directly to the default branch.
            Run the most relevant available tests and checks. If blocked, report the exact blocker and what was verified.
            Answer the triggering request directly. Report only actions actually performed, observed test results, and concrete blockers. Never claim a read/check/change occurred unless logs or tool results verify it.
