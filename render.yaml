# Hub API + SQLite worker and an isolated EL_AI background worker.
# The EL_AI worker has its own runtime, environment, and persistent disk.
services:
  - type: web
    name: mr-siavash-hub-ai
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install .
    startCommand: bash scripts/start-render.sh
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    disk:
      name: mrhub-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: MRH_ENVIRONMENT
        value: production
      - key: MRH_HOST
        value: 0.0.0.0
      - key: MRH_PORT
        value: 10000
      - key: MRH_DATABASE_PATH
        value: /var/data/mrhub.sqlite3
      - key: MRH_REQUIRE_WORKER_FOR_READINESS
        value: "true"
      # Hub-only secrets. They are not copied to the EL_AI worker.
      - key: MRH_WORKFLOW_PAYLOAD_KEY
        sync: false
      - key: MRH_OWNER_SETUP_TOKEN
        sync: false

  - type: worker
    name: mr-siavash-el-ai-bridge
    runtime: python
    repo: https://github.com/MRSIAVASSHIRBOT/MR_SIAVASH_EL_AI.git
    branch: main
    plan: starter
    region: frankfurt
    buildCommand: >-
      pip install "git+https://github.com/MRSIAVASSHIRBOT/MR_SIAVASH_EL_AI.git@5cbbd7c4fed09e61556184859641331398305757"
    startCommand: python -m el_ai
    autoDeployTrigger: "off"
    disk:
      name: el-ai-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: EL_AI_ENVIRONMENT
        value: production
      - key: EL_AI_STATE_DIR
        value: /var/data
      - key: EL_AI_CREDENTIAL_STORE
        value: encrypted_file
      - key: EL_AI_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_TRANSPORT
        value: cloudflare_bridge
      - key: TELEGRAM_BRIDGE_URL
        value: https://mr-siavash-el-ir-bot.mrsiavashirbot.workers.dev
      - key: TELEGRAM_BRIDGE_SHARED_SECRET
        sync: false
      - key: TELEGRAM_BRIDGE_TIMEOUT_SECONDS
        value: "8"
      - key: TELEGRAM_OWNER_IDS
        sync: false
      - key: TELEGRAM_PUBLIC_ENABLED
        value: "false"
      - key: HUB_INTEGRATION_ENABLED
        value: "true"
      # Render injects the Hub private host:port; EL_AI accepts this bare
      # host:port only with HUB_ALLOW_RENDER_PRIVATE_NETWORK=true.
      - key: HUB_API_BASE_URL
        fromService:
          name: mr-siavash-hub-ai
          type: web
          property: hostport
      - key: HUB_ALLOW_REMOTE
        value: "false"
      - key: HUB_ALLOW_RENDER_PRIVATE_NETWORK
        value: "true"
